name: Refresh npm lockfile (SEO maintenance)
on:
  push:
    branches: [seo/phase2-performance-content-20261112]
    paths:
      - .github/workflows/refresh-lockfile.yml
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/phase2-performance-content-20261112
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reconcile npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit updated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --staged --quiet; then
            git commit -m "build: synchronize package-lock.json with package.json"
            git push origin HEAD:seo/phase2-performance-content-20261112
          fi
