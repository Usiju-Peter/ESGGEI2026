name: SEO checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run seo:check
      - run: npm run lint
      - run: npm run build
      - run: npm run seo:check-built
      - run: node scripts/site-quality.mjs
      - run: npx playwright install chromium
      - run: node scripts/browser-smoke.mjs
      - run: node scripts/analytics-check.mjs
      - run: node scripts/design-regression.mjs
      - run: node scripts/premium-check.mjs
      - run: node scripts/accessibility.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-reports
          path: audit-results
