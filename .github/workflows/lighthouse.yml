name: Lighthouse SEO performance audit
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false lighthouse@13.6.0
      - run: npx playwright install chromium
      - run: npm run build
      - name: Measure the built revision on mobile
        if: github.event_name != 'schedule'
        run: |
          export CHROME_PATH="$(node -e "import('playwright').then(m=>process.stdout.write(m.chromium.executablePath()))")"
          node scripts/lighthouse-measure.mjs
      - name: Measure production on the weekly schedule
        if: github.event_name == 'schedule'
        env:
          LIGHTHOUSE_BASE_URL: https://www.esggei.org.ng
        run: |
          export CHROME_PATH="$(node -e "import('playwright').then(m=>process.stdout.write(m.chromium.executablePath()))")"
          node scripts/lighthouse-measure.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: esggei-lighthouse-reports
          path: audit-results/lighthouse
